name = "LeanLGV"
version = "0.1.0"
license = "Apache-2.0"
keywords = ["math", "combinatorics", "determinants"]
defaultTargets = ["LGV"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[lean_lib]]
name = "LGV"
